<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>War-Torn character set — design reference</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2ecd8; color: #3a2d28; font-family: 'Nunito', sans-serif; font-weight: 700; padding: 40px; }
  h1 { font-family: 'Baloo 2', cursive; font-weight: 800; margin: 0 0 4px; }
  .sub { color: #7c6a60; font-size: 14px; margin: 0 0 28px; }
  .grid { display: flex; flex-wrap: wrap; gap: 22px 16px; max-width: 1100px; }
  .cell { width: 112px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile { position: relative; width: 96px; height: 104px; }
  .tile > div { position: absolute; }
  .nm { font-family: 'Baloo 2', cursive; font-size: 14px; line-height: 1; text-align: center; }
  .rl { font-size: 9px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; text-align: center; }
</style>
</head>
<body>
<h1>War-Torn character set</h1>
<p class="sub">Design reference — each character is built from absolutely-positioned layers inside a 96&times;104&nbsp;px tile. All geometry lives in the script below.</p>
<div class="grid" id="grid"></div>

const S2_OPTS = {
  berserker: { rightEye: 'squint' },
  stalker: { eyes: 'custom' },
  juggernaut: { brows: 'none' },
  spammer: { mouth: 'none' },
  gatewarden: { mouth: 'none' },
  ironmaw: { mouth: 'none' },
  hexweaver: { mouth: 'none' },
  devourer: { mouth: 'none' },
  plaguewright: { eyes: 'custom', mouth: 'none', brows: 'none' },
  leech: { mouth: 'none' },
  devourling: { mouth: 'none' },
};

function s2(e, isEnemy) {
  const c = e.c, o = S2_OPTS[e.id] || {};
  const shape = isEnemy ? '40% 40% 32% 32% / 44% 44% 30% 30%' : '42% 42% 36% 36% / 48% 48% 34% 34%';
  const p = [
    `left:16%;right:16%;bottom:0;height:9px;background:rgba(58,45,40,.16);border-radius:50%;z-index:0;`,
    `left:6%;right:6%;top:13%;bottom:9%;background:${c};border:4px solid ${INK};border-radius:${shape};box-shadow:inset 0 -12px 0 rgba(58,45,40,.14),inset 0 4px 0 rgba(255,255,255,.3);z-index:1;`,
  ];
  if (o.brows !== 'none') {
    const deg = isEnemy ? 24 : 7, bt = isEnemy ? '30%' : '33%';
    p.push(`left:18%;top:${bt};width:19%;height:5px;background:${INK};border-radius:3px;transform:rotate(${deg}deg);z-index:5;`);
    p.push(`right:18%;top:${bt};width:19%;height:5px;background:${INK};border-radius:3px;transform:rotate(-${deg}deg);z-index:5;`);
  }
  if (o.eyes !== 'custom') {
    p.push(`left:20%;top:42%;width:16px;height:14px;background:${CREAM};border:2.5px solid ${INK};border-radius:50%;z-index:3;`);
    p.push(`left:27%;top:47%;width:6px;height:7px;background:${INK};border-radius:50%;z-index:4;`);
    if (o.rightEye === 'squint') {
      p.push(`right:20%;top:45%;width:16px;height:9px;background:${CREAM};border:2.5px solid ${INK};border-radius:50%;z-index:3;`);
      p.push(`right:27%;top:47%;width:6px;height:5px;background:${INK};border-radius:50%;z-index:4;`);
    } else {
      p.push(`right:20%;top:42%;width:16px;height:14px;background:${CREAM};border:2.5px solid ${INK};border-radius:50%;z-index:3;`);
      p.push(`right:27%;top:47%;width:6px;height:7px;background:${INK};border-radius:50%;z-index:4;`);
    }
  }
  if (o.mouth !== 'none') {
    if (isEnemy) p.push(`left:39%;top:65%;width:22%;height:8px;background:linear-gradient(90deg,${CREAM} 44%,${INK} 44%,${INK} 56%,${CREAM} 56%);border:2px solid ${INK};border-radius:3px;z-index:4;`);
    else p.push(`left:43%;top:66%;width:14%;height:4px;background:${INK};border-radius:0 0 6px 6px;z-index:4;`);
  }
  const f = S2F[e.id];
  if (f) p.push(...f(c));
  return p;
}

/* ---- Renderer: builds each character tile from the s2() layer list ---- */
const grid = document.getElementById('grid');
function addEntity(e, isEnemy, role, roleColor) {
  const cell = document.createElement('div'); cell.className = 'cell';
  const tile = document.createElement('div'); tile.className = 'tile';
  for (const style of s2(e, isEnemy)) {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + style;
    tile.appendChild(d);
  }
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = e.name;
  const rl = document.createElement('div'); rl.className = 'rl'; rl.textContent = role; rl.style.color = roleColor;
  cell.appendChild(tile); cell.appendChild(nm); cell.appendChild(rl);
  grid.appendChild(cell);
}
HEROES.forEach(h => addEntity(h, false, 'Hero', '#57b8a5'));
ENEMIES.forEach(en => addEntity(en, true, en.boss ? 'Boss' : 'Enemy', en.boss ? '#f0a832' : '#f07a5e'));
